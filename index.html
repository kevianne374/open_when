<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open When... 💌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Top Envelope -->
        <div class="envelope top-envelope" onclick="openLetter('miss')">
            <div class="envelope-flap"></div>
            <span>...you miss me 💭</span>
        </div>

        <!-- 2x2 Grid Envelopes -->
        <div class="envelope-grid">
            <div class="envelope" onclick="openLetter('sad')">
                <div class="envelope-flap"></div>
                <span>...you had a hard day 🩹</span>
            </div>
            <div class="envelope" onclick="openLetter('sad')">
                <div class="envelope-flap"></div>
                <span>...you had a hard day 🩹</span>
            </div>
            <div class="envelope" onclick="openLetter('laugh')">
                <div class="envelope-flap"></div>
                <span>...you need a laugh 😂</span>
            </div>
            <div class="envelope" onclick="openLetter('voice')">
                <div class="envelope-flap"></div>
                <span>...you want to hear my voice 🎙️</span>
            </div>
        </div>

        <!-- Popup Modal -->
        <div id="letterModal" class="modal" onclick="closeLetter()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <span class="close-btn" onclick="closeLetter()">&times;</span>
                <h3 id="letterTitle">Letter</h3>
                <p id="letterBody">Letter content goes here...</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
